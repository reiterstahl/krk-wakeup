name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Smoke test startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath build/Release/krk-wakeup.exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) {
              throw "Application exited during startup with code $($app.ExitCode)"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: krk-wakeup-windows-x64
          path: build/Release/krk-wakeup.exe
          if-no-files-found: error
