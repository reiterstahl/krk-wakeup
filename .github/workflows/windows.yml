name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test audio, recovery, and optional diagnostics
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath build/Release/krk-wakeup.exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) {
              throw "Application exited during startup with code $($app.ExitCode)"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Test Windows startup registration
        shell: pwsh
        run: ./tools/test-startup.ps1
      - name: Test audio recovery
        timeout-minutes: 2
        shell: pwsh
        run: ./tools/test-recovery.ps1
      - name: Capture app window
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./tools/capture-ui.ps1
      - name: Upload app screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: krk-wakeup-ui-capture
          path: capture/*.png
          if-no-files-found: error
      # Last, so that everything above still runs without an audio device.
      - name: Install a virtual sound card
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c
      - name: Test playback on a real Windows output
        timeout-minutes: 3
        shell: pwsh
        env:
          KRK_AUDIO_TEST: '1'
        run: ./build/Release/real-audio-tests.exe
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: krk-wakeup-windows-x64
          path: build/Release/krk-wakeup.exe
          if-no-files-found: error
