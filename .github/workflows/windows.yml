name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Smoke test startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath build/Release/krk-wakeup.exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) {
              throw "Application exited during startup with code $($app.ExitCode)"
            }
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("build/ui-preview.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bitmap.Dispose()
            } catch {
              Write-Warning "Could not capture UI preview: $_"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: krk-wakeup-ui-preview
          path: build/ui-preview.png
          if-no-files-found: ignore
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: krk-wakeup-windows-x64
          path: build/Release/krk-wakeup.exe
          if-no-files-found: error
